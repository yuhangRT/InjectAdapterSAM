runtime:
  output_dir: ./runs/wirecr_hqinstsam_vitl
  seed: 42
  gpu: 0
  resume: null

data:
  root: ./samDataset_instance_coco
  train_split: train
  val_split: val
  image_size: 1024

model:
  name: WireCRHQInstSAM
  sam_model_type: vit_l
  num_queries: 64
  query_decoder_layers: 6
  lora_rank: 16
  lora_alpha: 16
  lora_dropout: 0.0

train:
  epochs: 60
  warmup_epochs: 8
  batch_size: 1
  val_batch_size: 1
  workers: 4
  lr_lora: 0.00005
  lr_new_modules: 0.0002
  weight_decay: 0.05
  warmup_iters: 1000
  grad_accum_steps: 2
  grad_clip_norm: 0.1
  amp: true

infer:
  sliding_window: 1024
  overlap: 0.2
  score_thresh_label: auto_from_val
  score_thresh_hole: auto_from_val
